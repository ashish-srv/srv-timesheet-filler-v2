<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRV Timesheet Compliance — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #F5F6F8; color: #111827; min-height: 100vh; display: flex; flex-direction: column; }
.navbar { background: linear-gradient(135deg, #071226 0%, #0B1730 100%); padding: 16px 32px; }
.navbar-content { display: flex; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; }
.navbar-logo { height: 36px; }
.navbar-title { color: #fff; font-size: 19px; font-weight: 600; }
.wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { background: #fff; border-radius: 16px; padding: 48px; box-shadow: 0 4px 24px rgba(0,0,0,.08); border: 1px solid #E5E7EB; width: 100%; max-width: 420px; text-align: center; }
.title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.subtitle { font-size: 14px; color: #6B7280; margin-bottom: 32px; line-height: 1.6; }
.btn-google { display: inline-flex; align-items: center; gap: 12px; width: 100%; justify-content: center; padding: 13px 24px; border: 1.5px solid #E5E7EB; border-radius: 8px; font-size: 15px; font-weight: 600; color: #374151; background: #fff; text-decoration: none; transition: all .15s; }
.btn-google:hover { border-color: #CBD5E1; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.gicon { width: 20px; height: 20px; }
.note { font-size: 12px; color: #9CA3AF; margin-top: 20px; line-height: 1.5; }
.footer { text-align: center; padding: 20px; color: #6B7280; font-size: 12px; }
</style>
</head>
<body>
<nav class="navbar"><div class="navbar-content">
  <img src="/assets/srv-logo.png" class="navbar-logo" alt="SRV" onerror="this.style.display='none'">
  <span class="navbar-title">Timesheet Compliance</span>
</div></nav>
<div class="wrap">
  <div class="card">
    <div class="title">Sign in to continue</div>
    <div class="subtitle">Use your SRV Media Google account.<br>Access is limited to approved employees.</div>
    <a class="btn-google" href="/login">
      <svg class="gicon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </a>
    <div class="note">If you're not yet in the employee roster, contact your admin to be added.</div>
  </div>
</div>
<div class="footer">© 2026 SRV Media • Timesheet Compliance • Internal Use Only</div>
</body>
</html>
